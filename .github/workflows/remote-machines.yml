name: Remote machines (debug)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep machines alive (max ~350)"
        default: "60"
      os:
        description: "Which machines to start"
        type: choice
        default: all
        options: [all, windows, macos, linux, android, ios]

jobs:
  machine:
    strategy:
      fail-fast: false
      matrix:
        name: ${{ inputs.os == 'all' && fromJSON('["windows","macos","linux","android","ios"]') || fromJSON(format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.name == 'windows' && 'windows-latest' || (matrix.name == 'macos' || matrix.name == 'ios') && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - name: Windows - enable RDP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PW: ${{ secrets.REMOTE_PASSWORD }}
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-LocalUser -Name runneradmin -Password (ConvertTo-SecureString $env:PW -AsPlainText -Force)

      - name: macOS - enable Screen Sharing
        if: runner.os == 'macOS'
        env:
          PW: ${{ secrets.REMOTE_PASSWORD }}
        run: |
          # runner's password is unknown, so dscl can't change it; add our own admin user instead
          sudo sysadminctl -addUser remote -fullName remote -password "$PW" -admin
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -privs -all -restart -agent -allowAccessFor -allUsers
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true
          # kickstart can't grant screen capture/control since macOS 12 ("Screen Sharing is not permitted");
          # runner images allow writing the system TCC db, so grant it directly
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          for client in com.apple.screensharing.agent com.apple.RemoteDesktopAgent; do
            for svc in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceAccessibility; do
              sudo sqlite3 "$db" "INSERT OR REPLACE INTO access VALUES('$svc','$client',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s),NULL,NULL,'UNUSED',$(date +%s));"
            done
          done
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent -console

      - name: iOS - boot Simulator
        if: matrix.name == 'ios'
        env:
          PW: ${{ secrets.REMOTE_PASSWORD }}
        run: |
          # Simulator runs in runner's GUI session, so try to make runner loggable too
          sudo sysadminctl -resetPasswordFor runner -newPassword "$PW" || true
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          open -a Simulator

      - name: Android - boot emulator
        if: matrix.name == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          img="system-images;android-34;google_apis;x86_64"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator platform-tools "$img" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n dev -k "$img" -d pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd dev -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emu.log 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 60); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            pgrep -f qemu-system >/dev/null || { echo "emulator exited"; break; }
            sleep 5
          done
          [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] || { tail -40 emu.log; exit 1; }
          echo booted

      - name: Linux - enable password SSH
        if: matrix.name == 'linux'
        env:
          PW: ${{ secrets.REMOTE_PASSWORD }}
        run: |
          echo "runner:$PW" | sudo chpasswd
          echo "PasswordAuthentication yes" | sudo tee /etc/ssh/sshd_config.d/99-remote.conf
          sudo systemctl restart ssh || (sudo apt-get install -y openssh-server && sudo systemctl restart ssh)

      - name: Start Cloudflare quick tunnel
        shell: bash
        env:
          PW: ${{ secrets.REMOTE_PASSWORD }}
        run: |
          case "${{ matrix.name }}" in
            windows)   svc=rdp://localhost:3389; bin=cloudflared-windows-amd64.exe ;;
            macos|ios) svc=tcp://localhost:5900; bin=cloudflared-darwin-arm64.tgz ;;
            linux)     svc=ssh://localhost:22;   bin=cloudflared-linux-amd64 ;;
            android)   svc=tcp://localhost:5555; bin=cloudflared-linux-amd64 ;;  # emulator's adb port
          esac
          curl -sSL -o "$bin" "https://github.com/cloudflare/cloudflared/releases/latest/download/$bin"
          case "$bin" in *.tgz) tar xzf "$bin"; cf=./cloudflared ;; *) chmod +x "$bin"; cf="./$bin" ;; esac

          # cloudflared prints the URL, so keep its output out of the public log
          if [ "${{ runner.os }}" = macOS ]; then
            # the macOS runner reaps background processes; launchd keeps cloudflared alive
            sudo launchctl submit -l cloudflared -o "$PWD/cf.log" -e "$PWD/cf.log" -- "$PWD/cloudflared" tunnel --no-autoupdate --url "$svc"
          else
            "$cf" tunnel --no-autoupdate --url "$svc" > cf.log 2>&1 &
          fi
          for i in $(seq 60); do
            host=$(grep -oE '[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1) && [ -n "$host" ] && break
            sleep 2
          done
          [ -n "$host" ] || { echo "tunnel did not start"; exit 1; }
          echo "::add-mask::$host"

          # public repo: share the hostname encrypted with REMOTE_PASSWORD
          # (artifact, because job logs aren't readable until the job ends)
          printf '%s' "$host" | openssl enc -aes-256-cbc -pbkdf2 -a -A -pass env:PW > host-${{ matrix.name }}.enc

      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.name }}
          path: host-${{ matrix.name }}.enc

      - name: Keep alive
        shell: bash
        run: |
          end=$(( $(date +%s) + ${{ inputs.minutes }} * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            pgrep -f "cloudflared.*tunnel" >/dev/null || { echo "cloudflared died"; tail -20 cf.log | grep -v trycloudflare; exit 1; }
            sleep 30
          done
